name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --onefile --windowed --name "YouTube URL Downloader" trailer_downloader.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: YouTube-URL-Downloader-Windows
          path: dist/YouTube URL Downloader.exe
